<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Paper Reading Groups</title>
<style>
:root{color-scheme:light dark;--bg:#f7f8fb;--fg:#18202b;--muted:#667085;--line:#dce1e8;--panel:#fff;--accent:#243f73;--accentfg:#fff;--bad:#b42318;--good:#087443;--soft:#eef2f8}
@media(prefers-color-scheme:dark){:root{--bg:#10141b;--fg:#e9edf5;--muted:#a1acbd;--line:#2c3441;--panel:#171e28;--accent:#dbe7ff;--accentfg:#18202b;--soft:#202a38}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Noto Sans Myanmar",Padauk,sans-serif}main{max-width:1160px;margin:auto;padding:16px}h1{font-size:1.45rem;margin:.2rem 0 .6rem}h2{font-size:1.15rem;margin:.2rem 0 .4rem}h3{font-size:1rem;margin:.2rem 0}.muted,.help{color:var(--muted);font-size:.91rem}.help{margin:.2rem 0 .7rem}.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.brand{font-weight:750}.nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.nav button{min-height:38px;padding:6px 11px}.nav button.active{background:var(--accent);color:var(--accentfg)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:14px;min-width:0}.stack{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.rowstart{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.num{font-size:1.6rem;font-weight:750}.pill{display:inline-block;border-radius:99px;padding:2px 9px;background:var(--soft);font-size:.8rem}.pill.good{color:var(--good)}.pill.warn{color:#9a6700}.pill.bad{color:var(--bad)}input,select,textarea,button,.btn{font:inherit;min-width:0;max-width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--panel);color:var(--fg)}input,select,textarea{width:100%}textarea{min-height:100px;resize:vertical}button,.btn{cursor:pointer}button.primary,.btn{background:var(--accent);color:var(--accentfg);border-color:transparent}button.danger{color:var(--bad)}button:disabled{opacity:.55;cursor:not-allowed}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}.field{display:grid;gap:4px}.field label{font-size:.9rem;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions button{min-height:40px}.message{padding:10px 12px;margin:8px 0;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.message.error{color:var(--bad)}.message.success{color:var(--good)}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.divider{border:0;border-top:1px solid var(--line);margin:14px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}.small{font-size:.88rem}.paper-title{overflow-wrap:anywhere}.hide{display:none!important}.inline-select{width:auto;max-width:100%}.comment{border-left:3px solid var(--line);padding:6px 10px;margin:8px 0}.filelabel{display:inline-flex;align-items:center;gap:8px;cursor:pointer}.filelabel input{width:auto}.footer{border-top:1px solid var(--line);margin-top:24px;padding-top:12px}
</style>
<script src="./config.js"></script>
</head>
<body><main id="app"><p>ဖွင့်နေသည်…</p></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const $ = (s, root=document) => root.querySelector(s);
const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const safeUrl = value => /^https?:\/\//i.test(value || '') ? value : '';
const clean = value => String(value ?? '').replace(/[<>]/g,'').replace(/\s+/g,' ').trim();
const dateText = value => value ? new Date(value).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}) : '—';
const shortDate = value => value ? new Date(value).toLocaleDateString('en-GB',{dateStyle:'medium'}) : '—';
const bytesText = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n/1024).toFixed(1)} KB` : `${(n/1048576).toFixed(1)} MB`;
const fileToBase64 = async file => { const buf = await file.arrayBuffer(); return arrayBufferToBase64(buf); };
function arrayBufferToBase64(buffer){const bytes=new Uint8Array(buffer);let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+0x8000,bytes.length)));return btoa(binary)}
function base64ToBlob(value,type='application/octet-stream'){const raw=atob(value),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type})}
function download(name, blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}

const cfg = window.APP_CONFIG || {};
let sb = null, user = null, profile = null, activeTab = 'groups', notice = null, recoveryPending = false;
let groups=[], papers=[], progress=[], notes=[], discussions=[], memberships=[], profiles=[], legacyMembers=[], backupRuns=[];
const groupById = id => groups.find(x=>x.id===id);
const paperById = id => papers.find(x=>x.id===id);
const profileById = id => profiles.find(x=>x.id===id) || (profile?.id===id?profile:null);
const isAdmin = () => profile?.role === 'admin';
const myStatus = paperId => progress.find(x=>x.paper_id===paperId && x.user_id===user?.id)?.status || 'not_started';
function announce(text, type='success'){notice={text,type};render();}
function throwIf(error){if(error)throw error;}
async function rows(table, select='*'){const {data,error}=await sb.from(table).select(select);throwIf(error);return data||[];}
async function fetchAll(table){const all=[];for(let start=0; ; start+=1000){const {data,error}=await sb.from(table).select('*').range(start,start+999);throwIf(error);all.push(...(data||[]));if(!data||data.length<1000)break;}return all;}

function authView(message='', isError=false){$('#app').innerHTML=`<section style="max-width:480px;margin:7vh auto" class="stack">
  <div><h1>Paper Reading Groups</h1><p class="muted">Group · Student List · PDF · Deadline</p></div>
  ${!cfg.supabaseUrl || cfg.supabaseUrl.includes('YOUR-PROJECT-REF') || !cfg.supabasePublishableKey || cfg.supabasePublishableKey.includes('REPLACE_ME') ? `<div class="message error"><b>Supabase Setup လိုအပ်နေပါသည်</b><p>config.js ထဲရှိ project URL နှင့် publishable key ကို သင့် Supabase project အချက်အလက်ဖြင့် အစားထိုးပါ။ Secret/service role key ကို မထည့်ပါနှင့်။</p></div>`:''}
  <div class="card stack"><h2>Login</h2><form id="signinForm" class="stack"><div class="field"><label for="email">Student ID (သို့) Admin Email</label><input id="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="ဥပမာ STU-001"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">ဝင်မယ်</button><button type="button" data-action="resetRequest">Admin Email ဖြင့် Password Reset</button></form>
  ${message?`<div class="message ${isError?'error':'success'}" role="status">${esc(message)}</div>`:''}</div>
  <p class="muted small">ကျောင်းသားများကို Admin က Student ID နှင့် Password ထုတ်ပေးပါမည်။ Gmail မလိုပါ။ Public signup ကို ပိတ်ထားပါသည်။</p></section>`;}
function approvalView(){
 const rejected=profile?.approval_status==='rejected';
 const title=rejected?'Account ကို ခွင့်မပြုထားပါ':'Admin အတည်ပြုချက် စောင့်ဆိုင်းနေပါသည်';
 const body=rejected?'ဒီ Account ကို Admin က လက်ရှိတွင် ခွင့်မပြုထားပါ။ အဖွဲ့တာဝန်ရှိသူထံ ဆက်သွယ်ပါ။':'Account ဖွင့်ခြင်း အောင်မြင်ပါသည်။ Admin က Approve မလုပ်မချင်း Paper၊ Notes နှင့် Group Data များကို ဝင်ကြည့်၍ မရသေးပါ။';
 $('#app').innerHTML=`<section style="max-width:560px;margin:7vh auto" class="stack"><h1>Paper Reading Groups</h1><div class="card stack"><h2>${esc(title)}</h2><p>${esc(body)}</p><p class="muted small">Account: ${esc(profile?.student_id||profile?.email||user?.email||'')} · Status: ${rejected?'Rejected':'Pending Approval'}</p><div class="actions"><button data-action="refresh">အခြေအနေ ပြန်စစ်မယ်</button><button data-action="signout">Logout</button></div></div></section>`;
}
function passwordUpdateView(message='',isError=false){$('#app').innerHTML=`<section style="max-width:480px;margin:7vh auto" class="stack"><h1>Password အသစ် သတ်မှတ်ရန်</h1><div class="card stack"><form id="passwordUpdateForm" class="stack"><div class="field"><label for="recoveryPassword">Password အသစ် (အနည်းဆုံး 12 လုံး)</label><input id="recoveryPassword" type="password" minlength="12" autocomplete="new-password" required></div><button class="primary" type="submit">Password ပြောင်းမယ်</button></form>${message?`<div class="message ${isError?'error':'success'}">${esc(message)}</div>`:''}</div></section>`;}
function header(){return `<header class="top"><div><div class="brand">Paper Reading Groups</div><div class="muted small">${esc(profile?.display_name||user?.email||'Member')} · ${isAdmin()?'Admin':'Member'}</div></div><div class="actions"><button data-action="refresh">Refresh</button><button data-action="signout">Logout</button></div></header>
<nav class="nav">${[['groups','Groups'],['papers','PDF Papers'],...(isAdmin()?[['admin','Admin']]:[])].map(([id,label])=>`<button class="${activeTab===id?'active':''}" data-action="tab" data-id="${id}">${label}</button>`).join('')}</nav>
${notice?`<div class="message ${notice.type==='error'?'error':'success'}" role="status">${esc(notice.text)}</div>`:''}`;}
function appShell(content){$('#app').innerHTML=header()+content+`<footer class="footer muted small">Private data is protected by Supabase Auth, Row Level Security and private Storage. Do not publish database exports or PDF backups.</footer>`;}
function deadlinePill(date){if(!date)return '<span class="pill">Deadline မသတ်မှတ်ထားပါ</span>';const delta=new Date(date+'T23:59:59')-Date.now();if(delta<0)return '<span class="pill bad">ကျော်လွန်ပြီး</span>';if(delta<48*36e5)return '<span class="pill warn">နီးကပ်နေသည်</span>';return '<span class="pill good">အချိန်ကျန်သေးသည်</span>';}

function renderDashboard(){const mine=progress.filter(x=>x.user_id===user.id),completed=mine.filter(x=>x.status==='completed').length,reading=mine.filter(x=>x.status==='reading').length;const upcoming=papers.filter(p=>p.deadline&&new Date(p.deadline+'T23:59:59')>=new Date()).sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,6);
 const cards=`<div class="stats"><div class="card"><div class="muted">My Groups</div><div class="num">${memberships.filter(x=>x.user_id===user.id).length}</div></div><div class="card"><div class="muted">Papers Available</div><div class="num">${papers.length}</div></div><div class="card"><div class="muted">Reading</div><div class="num">${reading}</div></div><div class="card"><div class="muted">Completed</div><div class="num">${completed}</div></div></div>`;
 const deadlines=upcoming.length?`<div class="grid">${upcoming.map(p=>`<article class="card"><div class="row"><b class="paper-title">${esc(p.title)}</b>${deadlinePill(p.deadline)}</div><p class="muted">Group: ${esc(groupById(p.group_id)?.name||'—')}</p><p>Deadline: ${esc(shortDate(p.deadline))}</p><button data-action="openPaper" data-id="${p.id}">Paper ကိုကြည့်မယ်</button></article>`).join('')}</div>`:'<div class="empty">မကြာမီ deadline ရှိသော paper မရှိပါ။</div>';
 return `<h1>Dashboard</h1><p class="muted">ကိုယ်ပိုင် reading progress နှင့် လာမည့် deadline များ</p>${cards}<section class="stack" style="margin-top:18px"><h2>Upcoming Deadlines</h2>${deadlines}</section>`;}

function canManageGroup(groupId){return isAdmin()||memberships.some(m=>m.group_id===groupId&&m.user_id===user.id&&m.member_role==='manager');}
function paperCard(p){
 const group=groupById(p.group_id),canManage=canManageGroup(p.group_id);
 return `<article id="paper-${p.id}" class="card stack"><div class="row"><span class="pill">${esc(group?.name||'Group')}</span><span class="muted small">${esc(group?.deadline?shortDate(group.deadline):'Deadline မသတ်မှတ်ရသေး')}</span></div><h2 class="paper-title">${esc(p.title)}</h2><div class="row"><span class="muted small">PDF ဖိုင်</span><div class="actions">${p.pdf_path?`<button class="primary" data-action="openPdf" data-id="${p.id}">PDF ဖွင့်မယ်</button><button data-action="downloadPdf" data-id="${p.id}">PDF Download</button>`:'<span class="muted small">PDF မတင်ရသေးပါ</span>'}${canManage?`<button class="danger" data-action="deletePaper" data-id="${p.id}">ဖျက်မယ်</button>`:''}</div></div></article>`;
}
function renderPapers(){return `<div class="row"><div><h1>PDF Papers</h1><p class="muted">PDF ဖိုင်ကိုသာ တင်ပါ။ ခေါ 제목ကို ဖိုင်နာမည်ကနေ အလိုအလျောက်ယူပါမယ်။</p></div></div>
${isAdmin()||memberships.some(m=>m.member_role==='manager')?`<form id="paperForm" class="card stack" style="margin:12px 0"><div class="field"><label>Group</label><select id="paperGroup" required><option value="">Group ရွေးပါ</option>${groups.filter(g=>canManageGroup(g.id)).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div class="field"><label>PDF ဖိုင် (20 MB အထိ)</label><input id="paperPdf" type="file" accept="application/pdf,.pdf" required></div><button class="primary" type="submit">PDF တင်မယ်</button></form>`:''}
${papers.length?`<div id="paperList" class="grid">${papers.map(paperCard).join('')}</div>`:'<div class="empty">PDF မရှိသေးပါ။</div>'}`;}

function renderProgress(){return `<h1>Reading Progress</h1><p class="muted">Progress ကို account တစ်ခုချင်းစီအလိုက် သိမ်းဆည်းထားသည်။</p>${papers.length?`<div class="stack">${papers.map(p=>`<div class="card row"><div><b>${esc(p.title)}</b><div class="muted small">${esc(groupById(p.group_id)?.name||'')} · Updated: ${esc(dateText(progress.find(x=>x.paper_id===p.id&&x.user_id===user.id)?.updated_at))}</div></div><select class="inline-select" data-action="saveProgress" data-id="${p.id}"><option value="not_started" ${myStatus(p.id)==='not_started'?'selected':''}>Not started</option><option value="reading" ${myStatus(p.id)==='reading'?'selected':''}>Reading</option><option value="completed" ${myStatus(p.id)==='completed'?'selected':''}>Completed</option></select></div>`).join('')}</div>`:'<div class="empty">Progress မှတ်တမ်းတင်ရန် အရင်ဆုံး Paper Library ထဲတွင် group paper တစ်ခု ရှိရပါမည်။'}</div>`;}

function renderNotes(){const noteCards=notes.map(n=>{const ds=discussions.filter(d=>d.note_id===n.id).sort((a,b)=>a.created_at.localeCompare(b.created_at));return `<article class="card stack"><div class="row"><span class="pill">${n.visibility==='private'?'Private':'Group Shared'}</span><span class="muted small">${esc(groupById(n.group_id)?.name||'')}</span></div><h2>${esc(n.title)}</h2><div class="muted small">${esc(n.author_id===user.id?(profile?.display_name||'You'):(profileById(n.author_id)?.display_name||'Group member'))} · ${esc(dateText(n.updated_at))}</div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.content)}</p>${n.paper_id&&paperById(n.paper_id)?`<p class="muted small">Paper: ${esc(paperById(n.paper_id).title)}</p>`:''}<div><b>Discussion (${ds.length})</b>${ds.map(d=>`<div class="comment"><div class="muted small">${esc(d.author_id===user.id?'You':(profileById(d.author_id)?.display_name||'Member'))} · ${esc(dateText(d.created_at))}</div><div style="white-space:pre-wrap">${esc(d.content)}</div></div>`).join('')||'<p class="muted small">မှတ်ချက်မရှိသေးပါ။</p>'}<div class="row" style="align-items:flex-start"><textarea id="discussion-${n.id}" placeholder="ဆွေးနွေးချက် ရေးပါ…" rows="2"></textarea><button data-action="addDiscussion" data-id="${n.id}">Send</button></div></div>${n.author_id===user.id||isAdmin()?`<button class="danger" data-action="deleteNote" data-id="${n.id}">Note ဖျက်မယ်</button>`:''}</article>`;}).join('');
 return `<h1>Research Notes & Discussion</h1><p class="muted">Private note ကို ကိုယ်တိုင်သာ မြင်နိုင်ပြီး Group Shared note ကို group member များ မြင်နိုင်သည်။</p><details class="card" open><summary><b>Note အသစ်ရေးရန်</b></summary><form id="noteForm" class="stack" style="margin-top:12px"><div class="formgrid"><div class="field"><label>Group *</label><select id="noteGroup" required><option value="">ရွေးပါ</option>${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div class="field"><label>Related Paper</label><select id="notePaper"><option value="">— မရွေးထားပါ —</option>${papers.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select></div><div class="field"><label>Visibility</label><select id="noteVisibility"><option value="private">Private</option><option value="group_shared">Group Shared</option></select></div><div class="field"><label>Title *</label><input id="noteTitle" required maxlength="250"></div></div><div class="field"><label>Note *</label><textarea id="noteContent" required maxlength="30000"></textarea></div><button class="primary" type="submit">Save Note</button></form></details><section class="grid" style="margin-top:14px">${noteCards||'<div class="empty">Note မရှိသေးပါ။</div>'}</section>`;}

function renderGroups(){
 return `<div class="row"><div><h1>Groups</h1><p class="muted">Group အမည်၊ Student List နဲ့ Deadline ကို သီးခြားစီ စီမံပါ။</p></div></div>${isAdmin()?`<form id="groupForm" class="card stack" style="margin-bottom:12px"><div class="field"><label for="groupName">Group အမည်</label><input id="groupName" required maxlength="150" placeholder="ဥပမာ - Group A"></div><div class="field"><label for="groupDeadline">Deadline</label><input id="groupDeadline" type="date"></div><button class="primary" type="submit">Group ထည့်မယ်</button></form>`:''}${groups.length?`<div class="stack">${groups.map(g=>{
  const gm=memberships.filter(m=>m.group_id===g.id),allowed=canManageGroup(g.id),students=legacyMembers.filter(x=>x.group_id===g.id);

v class="field"><label for="studentDisplayName">ကျောင်းသားအမည်</label><input id="studentDisplayName" name="display_name" required maxlength="100"></div><div class="field"><label for="studentPassword">ယာယီ Password (ပထမ Login တွင် ပြောင်းရမည်)</label><input id="studentPassword" name="password" type="password" required minlength="12" autocomplete="new-password"><span class="muted small">အနည်းဆုံး 12 လုံး။ ကျောင်းသားကို လုံခြုံတဲ့နည်းနဲ့ သီးသန့်ပေးပါ။</span></div></div><button class="primary" type="submit">Account ဖန်တီးမယ်</button></form></section><section class="card stack" style="margin-top:12px"><h2>Pending Approval (${pendingProfiles.length})</h2><p class="muted small">Account အသစ်များကို အတည်ပြုပြီးမှ Website အသုံးပြုခွင့် ရရှိမည်။</p>${pendingProfiles.map(p=>`<div class="row"><div><b>${esc(p.display_name)}</b><div class="muted small">${esc(p.email||'')} · ${esc(p.created_at?shortDate(p.created_at):'')}</div></div><div class="actions"><button class="primary" data-action="approveMember" data-id="${p.id}">Approve</button><button class="danger" data-action="rejectMember" data-id="${p.id}">Reject</button></div></div>`).join('')||'<p class="empty">အတည်ပြုရန် Member အသစ် မရှိပါ။</p>'}</section><section class="card stack" style="margin-top:12px"><h2>Registered accounts</h2><p class="muted small">Admin role ကို ယုံကြည်ရသော account များကိုသာ ပေးပါ။ Approval status ကိုလည်း ဒီနေရာမှာ ပြန်ပြောင်းနိုင်သည်။</p>${profiles.map(p=>`<div class="row"><div><b>${esc(p.display_name)}</b><div class="muted small">${esc(p.student_id||p.email||'')} · ${esc(p.id)}</div></div><div class="actions"><span class="pill">${esc(p.role)}</span><span class="pill ${p.approval_status==='approved'?'good':p.approval_status==='rejected'?'bad':'warn'}">${esc(p.approval_status||'unknown')}</span>${p.id!==user.id?`${p.approval_status!=='approved'?`<button class="primary" data-action="approveMember" data-id="${p.id}">Approve</button>`:''}${p.approval_status!=='rejected'?`<button class="danger" data-action="rejectMember" data-id="${p.id}">Reject</button>`:''}${p.student_id?`<button data-action="resetStudentPassword" data-id="${p.id}">Password ပြန်သတ်မှတ်</button><button class="danger" data-action="deleteStudentAccount" data-id="${p.id}">Account ဖျက်မယ်</button>`:''}${!p.student_id?`<button data-action="toggleRole" data-id="${p.id}">${p.role==='admin'?'Make Member':'Make Admin'}</button>`:''}`:''}</div></div>`).join('')}</section>
<section class="card stack" style="margin-top:12px"><h2>Backup</h2><p class="muted small">Database records နှင့် Paper PDF များကို JSON backup တစ်ခုထဲသို့ ထည့်နိုင်သည်။ Local JSON download အတွက် PDF စုစုပေါင်း 20 MB cap ရှိသည်။ Private Storage backup သည် PDF များကို object သီးခြားစီ သိမ်းဆည်းပြီး Storage quota ကန့်သတ်ချက်အတွင်း ပိုကြီးသော dataset ကို ပံ့ပိုးသည်။</p><div class="actions"><button class="primary" data-action="backupDownload">Create & Download Backup</button><button data-action="backupStore">Create & Save Private Backup</button></div>${backupRuns.length?`<h3>Private backups</h3>${backupRuns.map(b=>`<div class="row"><div><b>${esc(dateText(b.created_at))}</b><div class="muted small">${esc(bytesText(Number(b.backup_bytes)||0))} · ${esc(b.storage_path)}</div></div><button data-action="restoreStored" data-id="${b.id}">Download & Restore</button></div>`).join('')}`:'<p class="muted small">Private backup မရှိသေးပါ။'}</section>
<section class="card stack" style="margin-top:12px"><h2>Restore / Legacy Migration</h2><p class="muted small">Restore သည် backup ထဲရှိ record များကို upsert လုပ်မည်ဖြစ်ပြီး backup ထဲတွင် မပါသော လက်ရှိ record များကို အလိုအလျောက် ဖျက်မည်မဟုတ်ပါ။ အရင် backup ယူပါ။ Legacy export ကနေ Group / Paper metadata / old student names များကို တင်သွင်းနိုင်သည်။ PDF အဟောင်းများကို လက်ရှိ bucket သို့ သီးခြား upload ပြုလုပ်ရန်လိုသည်။</p><div class="field"><label>Backup JSON သို့မဟုတ် legacy-export.json</label><input id="restoreFile" type="file" accept="application/json,.json"></div><button data-action="restoreFile">Validate & Restore Selected File</button><hr class="divider"><h3>Legacy student names (မည်သူ၏ login နှင့် မချိတ်ရသေးသော အမည်များ)</h3>${legacyMembers.length?legacyMembers.map(l=>`<div class="row"><div><b>${esc(l.display_name)}</b><div class="muted small">${esc(groupById(l.group_id)?.name||(l.group_id?'Group':'Unassigned'))} ${l.assigned_user_id?'· Linked':''}</div></div>${!l.assigned_user_id?`<div class="row"><select id="legacy-group-${l.id}"><option value="">Group ရွေးပါ</option>${groups.map(g=>`<option value="${g.id}" ${g.id===l.group_id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><select id="legacy-${l.id}"><option value="">Account ရွေးပါ</option>${profiles.filter(p=>p.role==='member').map(p=>`<option value="${p.id}">${esc(p.display_name)} · ${esc(p.email||'')}</option>`).join('')}</select><button data-action="assignLegacy" data-id="${l.id}">Link</button></div>`:''}</div>`).join(''):'<p class="muted small">Legacy student name မရှိပါ။'}</section>`;}

function render(){if(!user||!profile){authView();return;}if(profile.approval_status!=='approved'){approvalView();return;}let content='';switch(activeTab){case 'papers':content=renderPapers();break;case 'groups':content=renderGroups();break;case 'admin':content=isAdmin()?renderAdmin():renderGroups();break;default:content=renderGroups();}appShell(content);}

async function loadData(){if(!user)throw new Error('Login session မရှိပါ။');
 const {data:p,error:pe}=await sb.from('profiles').select('*').eq('id',user.id).single();throwIf(pe);profile=p;
 if(profile.approval_status!=='approved'){groups=[];papers=[];progress=[];notes=[];discussions=[];memberships=[];profiles=[profile];legacyMembers=[];backupRuns=[];return;}
 const [g,pa,pr,no,di,me]=await Promise.all([
  rows('groups'),rows('papers'),sb.from('reading_progress').select('*').eq('user_id',user.id).then(r=>{throwIf(r.error);return r.data||[]}),rows('research_notes'),rows('discussions'),rows('group_members')
 ]);groups=g;papers=pa;progress=pr;notes=no;discussions=di;memberships=me;
 if(isAdmin()){const [ps,lm,br]=await Promise.all([rows('profiles'),rows('legacy_members'),rows('backup_runs')]);profiles=ps;legacyMembers=lm;backupRuns=br.sort((a,b)=>b.created_at.localeCompare(a.created_at));}
 else {profiles=[profile];legacyMembers=[];backupRuns=[];}
}
async function afterChange(message){await loadData();notice={text:message,type:'success'};render();}
function studentAuthEmail(value){const id=String(value||'').trim();if(id.includes('@'))return id;const normalized=id.toLowerCase();if(!/^[a-z0-9][a-z0-9._-]{2,39}$/.test(normalized))throw new Error('Student ID သည် အင်္ဂလိပ်အက္ခရာ၊ နံပါတ်၊ dot, underscore, hyphen ဖြင့် 3–40 လုံး ဖြစ်ရပါမည်');return `${normalized}@students.paper-reading-groups.invalid`;}
async function signIn(form){const identifier=$('#email').value.trim(),password=$('#password').value,email=studentAuthEmail(identifier);const {data,error}=await sb.auth.signInWithPassword({email,password});throwIf(error);user=data.user;await loadData();if(profile?.must_change_password){passwordUpdateView('လုံခြုံရေးအတွက် ယာယီ Password ကို အခု ပြောင်းပါ။ Password အသစ် အနည်းဆုံး 12 လုံးထားပါ။');return;}activeTab='groups';notice={text:'Login အောင်မြင်ပါသည်',type:'success'};render();}
async function signUp(form){const displayName=clean($('#displayName').value),email=$('#newEmail').value.trim(),password=$('#newPassword').value;if(password.length<8)throw new Error('Password အနည်းဆုံး 8 လုံး လိုအပ်ပါသည်');const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:displayName}}});throwIf(error);if(data.session){user=data.user;await loadData();render();}else{authView('Account request လက်ခံပြီးပါပြီ။ Email confirmation ဖွင့်ထားပါက Email ကို အရင်အတည်ပြုပြီး Login ဝင်ပါ။ ထို့နောက် Admin ၏ Approve ခွင့်ပြုချက်ကို စောင့်ရပါမည်။');}}
async function requestPasswordReset(){const email=$('#email')?.value.trim();if(!email||!email.includes('@'))throw new Error('Student ID account အတွက် Password ကို Admin ထံမှ ပြန်သတ်မှတ်ခိုင်းပါ။ Admin Email account အတွက် Email ကို ဖြည့်ပါ။');const redirectTo=new URL(location.pathname,location.origin).toString();const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});throwIf(error);authView('Password reset link ကို account နှင့် ကိုက်ညီပါက email သို့ ပို့ပေးပါမည်။ Email နှင့် spam folder ကိုစစ်ပါ။');}
async function updatePassword(){const password=$('#recoveryPassword').value;if(password.length<12)throw new Error('Password အနည်းဆုံး 12 လုံး လိုအပ်ပါသည်');const {error}=await sb.auth.updateUser({password});throwIf(error);recoveryPending=false;history.replaceState(null,'',location.pathname+location.search);user=(await sb.auth.getUser()).data.user;await loadData();if(profile?.must_change_password){const {error:profileError}=await sb.from('profiles').update({must_change_password:false}).eq('id',user.id);throwIf(profileError);await loadData();}activeTab='groups';notice={text:'Password ပြောင်းပြီးပါပြီ',type:'success'};render();}
async function createGroup(){const name=clean($('#groupName').value),deadline=$('#groupDeadline').value||null;if(!name)throw new Error('Group အမည်ထည့်ပါ');const {error}=await sb.from('groups').insert({name,deadline,created_by:user.id});throwIf(error);await afterChange('Group ဖန်တီးပြီးပါပြီ');}
async function saveGroupDeadline(form){const id=form.dataset.groupDeadline,deadline=form.elements.namedItem('deadline').value||null;const {error}=await sb.from('groups').update({deadline}).eq('id',id);throwIf(error);await afterChange('Group deadline သိမ်းပြီးပါပြီ');}
async function addStudent(form){const groupId=form.dataset.studentForm,name=clean(form.elements.namedItem('student_name').value);if(!name)throw new Error('Student အမည်ထည့်ပါ');const {error}=await sb.from('legacy_members').insert({group_id:groupId,display_name:name,legacy_student_id:crypto.randomUUID()});throwIf(error);await afterChange('Student ထည့်ပြီးပါပြီ');}
async function deleteStudent(id){const st=legacyMembers.find(x=>x.id===id);if(!st||!confirm(`${st.display_name} ကို Student List မှ ဖယ်ရှားမလား။`))return;const {error}=await sb.from('legacy_members').delete().eq('id',id);throwIf(error);await afterChange('Student ဖယ်ရှားပြီးပါပြီ');}
async function deleteGroup(id){const g=groupById(id);if(!g||!confirm(`“${g.name}” group နှင့် သက်ဆိုင်သော Paper၊ Progress၊ Notes များကို ဖျက်မလား။`))return;const {error}=await sb.from('groups').delete().eq('id',id);throwIf(error);await afterChange('Group ဖျက်ပြီးပါပြီ');}
async function addMember(form){const groupId=form.dataset.addMember,userId=form.elements.namedItem('user_id').value;if(!userId)throw new Error('Account ရွေးပါ');const {error}=await sb.from('group_members').insert({group_id:groupId,user_id:userId,member_role:'member',added_by:user.id});throwIf(error);await afterChange('Group member ထည့်ပြီးပါပြီ');}
async function removeMember(key){const [groupId,userId]=key.split('|');if(!confirm('ဒီ account ကို group မှ ဖယ်ရှားမလား။'))return;const {error}=await sb.from('group_members').delete().eq('group_id',groupId).eq('user_id',userId);throwIf(error);await afterChange('Member ဖယ်ရှားပြီးပါပြီ');}
async function editPaper(form){
 const id=form.dataset.editPaper,p=paperById(id);if(!p)throw new Error('Paper မတွေ့ပါ');
 const val=name=>form.elements.namedItem(name)?.value??'';

 if(!title)throw new Error('Paper title ဖြည့်ပါ');if(url&&!safeUrl(url))throw new Error('Source URL သည် http(s):// ဖြင့် စရပါမည်');if(year!==null&&(!Number.isInteger(year)||year<1500||year>2200))throw new Error('Published year သည် 1500 မှ 2200 အတွင်း ဖြစ်ရပါမည်');
 if(file&&(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')))throw new Error('PDF ဖိုင်ကိုသာ တင်နိုင်သည်');if(file&&file.size>20*1024*1024)throw new Error('PDF သည် 20 MB ထက် မကျော်ရပါ');
 let pdfPath=p.pdf_path,uploadedPath=null;
 if(file){const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-120)||'paper.pdf';pdfPath=`${p.group_id}/${p.id}/${crypto.randomUUID()}-${safeName}`;const {error}=await sb.storage.from('papers-private').upload(pdfPath,file,{contentType:'application/pdf',upsert:false});throwIf(error);uploadedPath=pdfPath;}
 const {error}=await sb.from('papers').update({title,author:author||null,doi:doi||null,source_url:url||null,topic:topic||null,published_year:year,deadline,pdf_path:pdfPath}).eq('id',id);
 if(error){if(uploadedPath)await sb.storage.from('papers-private').remove([uploadedPath]);throw error;}

async function createPaper(){const groupId=$('#paperGroup').value,file=$('#paperPdf').files[0];if(!groupId||!file)throw new Error('Group နဲ့ PDF ဖိုင်ကို ရွေးပါ');if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf'))throw new Error('PDF ဖိုင်ကိုသာ တင်နိုင်သည်');if(file.size>20*1024*1024)throw new Error('PDF သည် 20 MB ထက် မကျော်ရပါ');const id=crypto.randomUUID(),title=file.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').trim()||'Paper';const path=`${groupId}/${id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-120)||'paper.pdf'}`;const {error:upError}=await sb.storage.from('papers-private').upload(path,file,{contentType:'application/pdf',upsert:false});throwIf(upError);const {error}=await sb.from('papers').insert({id,group_id:groupId,title,pdf_path:path,created_by:user.id});if(error)await sb.storage.from('papers-private').remove([path]);throwIf(error);await afterChange('PDF တင်ပြီးပါပြီ');}

async function deletePaper(id){const p=paperById(id);if(!p||!confirm(`“${p.title}” ကို ဖျက်မလား။ Progress နှင့် ဆက်စပ်သော Notes ပျောက်နိုင်ပါသည်။`))return;const {error}=await sb.from('papers').delete().eq('id',id);throwIf(error);if(p.pdf_path)await sb.storage.from('papers-private').remove([p.pdf_path]);await afterChange('Paper ဖျက်ပြီးပါပြီ');}

async function createNote(){const groupId=$('#noteGroup').value,paperId=$('#notePaper').value||null,title=clean($('#noteTitle').value),content=$('#noteContent').value.trim(),visibility=$('#noteVisibility').value;if(!groupId||!title||!content)throw new Error('Group၊ Title နှင့် Note ဖြည့်ပါ');const selected=paperId?paperById(paperId):null;if(selected&&selected.group_id!==groupId)throw new Error('ရွေးထားသော Paper သည် ဒီ Group ထဲမှာ မရှိပါ');const {error}=await sb.from('research_notes').insert({group_id:groupId,paper_id:paperId,author_id:user.id,title,content,visibility});throwIf(error);await afterChange('Research note သိမ်းပြီးပါပြီ');}
async function addDiscussion(noteId){const note=notes.find(n=>n.id===noteId),el=$(`#discussion-${noteId}`),content=el?.value.trim();if(!note||!content)throw new Error('Discussion ရေးပါ');const {error}=await sb.from('discussions').insert({group_id:note.group_id,paper_id:note.paper_id,note_id:note.id,author_id:user.id,content});throwIf(error);await afterChange('Discussion ပို့ပြီးပါပြီ');}
async function deleteNote(id){const note=notes.find(n=>n.id===id);if(!note||!confirm(`“${note.title}” note ကို ဖျက်မလား။`))return;const {error}=await sb.from('research_notes').delete().eq('id',id);throwIf(error);await afterChange('Note ဖျက်ပြီးပါပြီ');}

async function resetStudentPassword(id){const p=profiles.find(x=>x.id===id);if(!p?.student_id)throw new Error('Student ID account မတွေ့ပါ။');const password=prompt(`${p.student_id} အတွက် Password အသစ်ထည့်ပါ (အနည်းဆုံး 12 လုံး):`);if(password===null)return;if(password.length<12)throw new Error('Password အနည်းဆုံး 12 လုံး ထည့်ပါ။');if(!confirm(`${p.student_id} ၏ Password ကို ပြောင်းမလား။`))return;await callStudentAdmin({action:'reset-password',userId:id,password});await afterChange(`${p.student_id} ၏ Password ပြောင်းပြီးပါပြီ။ ကျောင်းသားထံ လုံခြုံစွာ အသိပေးပါ။`);}
async function deleteStudentAccount(id){const p=profiles.find(x=>x.id===id);if(!p?.student_id||p.role==='admin')throw new Error('ဖျက်နိုင်သော Student account မတွေ့ပါ။');if(!confirm(`${p.student_id} (${p.display_name}) ကို Account အပြီးဖျက်မလား။ Login ဝင်မရတော့ဘဲ Progress/Notes/Group membership တွေလည်း ဖျက်နိုင်ပါတယ်။`))return;await callStudentAdmin({action:'delete',userId:id});await afterChange(`${p.student_id} account ကို အပြီးဖျက်ပြီးပါပြီ။`);}
async function createStudentAccount(form){if(!isAdmin())throw new Error('Admin ခွင့်ပြုချက်လိုအပ်ပါသည်');const studentId=form.elements.namedItem('student_id').value.trim().toLowerCase(),displayName=clean(form.elements.namedItem('display_name').value),password=form.elements.namedItem('password').value;if(!/^[a-z0-9][a-z0-9._-]{2,39}$/.test(studentId))throw new Error('Student ID ပုံစံမမှန်ပါ');if(password.length<12)throw new Error('Password အနည်းဆုံး 12 လုံး ထည့်ပါ');const {data:{session}}=await sb.auth.getSession();if(!session?.access_token)throw new Error('Admin session မရှိပါ။ ပြန် Login ဝင်ပါ။');const {data,error}=await sb.functions.invoke('admin-students',{body:{action:'create',studentId,displayName,password}});throwIf(error);if(data?.error)throw new Error(data.error);form.reset();await afterChange(`Student Account ${studentId} ဖန်တီးပြီးပါပြီ။ Student ID နဲ့ Password ကို ကျောင်းသားထံ လုံခြုံစွာပေးပါ။`);}
async function setMemberApproval(id,status){const p=profiles.find(x=>x.id===id);if(!p||p.id===user.id)throw new Error('ကိုယ့် Admin account ကို ဒီနေရာမှ approval ပြောင်း၍ မရပါ');if(!['approved','rejected'].includes(status))throw new Error('Approval status မမှန်ပါ');const label=status==='approved'?'Approve':'Reject';if(!confirm(`${p.display_name} (${p.email||''}) ကို ${label} လုပ်မလား။`))return;const {error}=await sb.from('profiles').update({approval_status:status}).eq('id',id);throwIf(error);await afterChange(status==='approved'?'Member ကို Approve လုပ်ပြီးပါပြီ။ အခု Login ပြန်ဝင်နိုင်ပါပြီ။':'Member ကို Reject လုပ်ပြီးပါပြီ။ Website Data များကို ဝင်ကြည့်ခွင့် ပိတ်ထားပါသည်။');}
async function approveMember(id){return setMemberApproval(id,'approved');}
async function rejectMember(id){const p=profiles.find(x=>x.id===id);if(p?.student_id)return deleteStudentAccount(id);return setMemberApproval(id,'rejected');}
async function toggleRole(id){const p=profiles.find(x=>x.id===id);if(!p||!confirm(`${p.display_name} ကို ${p.role==='admin'?'Member':'Admin'} ပြောင်းမလား။`))return;const next=p.role==='admin'?'member':'admin';const {error}=await sb.from('profiles').update({role:next}).eq('id',id);throwIf(error);await afterChange('Account role ပြောင်းပြီးပါပြီ');}

async function allBackupTables(){const names=['profiles','groups','group_members','papers','reading_progress','research_notes','discussions','legacy_members'];const out={};for(const name of names)out[name]=await fetchAll(name);return out;}
async function makeBackup(store){
 const tables=await allBackupTables(),stamp=new Date().toISOString().replace(/[:.]/g,'-'),runId=crypto.randomUUID(),files=[];let totalPdfBytes=0;
 if(store){
  const uploaded=[];let manifestPath=null,recordCreated=false;
  try{
   for(const paper of tables.papers){if(!paper.pdf_path)continue;const {data,error}=await sb.storage.from('papers-private').download(paper.pdf_path);throwIf(error);totalPdfBytes+=data.size;const backupPath=`manual/${stamp}-${runId}/pdfs/${String(files.length+1).padStart(4,'0')}.pdf`;const {error:uploadError}=await sb.storage.from('backups-private').upload(backupPath,data,{contentType:'application/pdf',upsert:false});throwIf(uploadError);uploaded.push(backupPath);files.push({path:paper.pdf_path,backupPath,contentType:'application/pdf',size:data.size});}
   const bundle={format:'paper-reading-groups-backup-v1',backupMode:'split-private-storage',createdAt:new Date().toISOString(),projectUrl:cfg.supabaseUrl,tables,files};const manifest=new Blob([JSON.stringify(bundle)],{type:'application/json'});manifestPath=`manual/${stamp}-${runId}/manifest.json`;if(manifest.size>50*1024*1024)throw new Error('Backup manifest သည် Storage 50 MB limit ကို ကျော်နေပါသည်။');const {error:manifestError}=await sb.storage.from('backups-private').upload(manifestPath,manifest,{contentType:'application/json',upsert:false});throwIf(manifestError);uploaded.push(manifestPath);
   const details={format:bundle.format,backupMode:bundle.backupMode,files:files.length,pdfBytes:totalPdfBytes,records:Object.fromEntries(Object.entries(tables).map(([k,v])=>[k,v.length]))};const {error:dbError}=await sb.from('backup_runs').insert({created_by:user.id,storage_path:manifestPath,backup_bytes:manifest.size+totalPdfBytes,details});throwIf(dbError);recordCreated=true;
   await afterChange(`Private backup သိမ်းပြီးပါပြီ (${bytesText(manifest.size+totalPdfBytes)} · PDF ${files.length} files)`);
  }catch(error){if(!recordCreated&&uploaded.length)await sb.storage.from('backups-private').remove(uploaded);throw error;}
  return;
 }
 for(const paper of tables.papers){if(!paper.pdf_path)continue;const {data,error}=await sb.storage.from('papers-private').download(paper.pdf_path);throwIf(error);totalPdfBytes+=data.size;if(totalPdfBytes>20*1024*1024)throw new Error('Local JSON download backup အတွက် PDF စုစုပေါင်း 20 MB cap ကို ကျော်နေပါသည်။ Private Backup Storage mode ကို သုံးပါ။');files.push({path:paper.pdf_path,contentType:'application/pdf',size:data.size,base64:await fileToBase64(data)});}
 const bundle={format:'paper-reading-groups-backup-v1',backupMode:'self-contained-json',createdAt:new Date().toISOString(),projectUrl:cfg.supabaseUrl,tables,files};const json=JSON.stringify(bundle);const blob=new Blob([json],{type:'application/json'});const filename=`paper-groups-backup-${stamp}.json`;download(filename,blob);announce(`Backup download စတင်ပါပြီ (${bytesText(blob.size)})`);
}
async function restoreBundle(bundle){if(!bundle||bundle.format!=='paper-reading-groups-backup-v1'||!bundle.tables||typeof bundle.tables!=='object')throw new Error('Backup ဖိုင်ပုံစံ မမှန်ပါ');const order=['profiles','groups','group_members','papers','reading_progress','research_notes','discussions','legacy_members'];for(const table of order){if(bundle.tables[table]!==undefined&&!Array.isArray(bundle.tables[table]))throw new Error(`Backup ထဲရှိ ${table} data ပုံစံ မမှန်ပါ`);}const files=bundle.files??[];if(!Array.isArray(files))throw new Error('Backup PDF စာရင်း ပုံစံ မမှန်ပါ');for(const f of files){if(!f||typeof f.path!=='string'||(!f.base64&&!f.backupPath))throw new Error('Backup file bytes/reference မရှိပါ');}if(bundle.projectUrl&&bundle.projectUrl!==cfg.supabaseUrl&&!confirm('ဒီ backup သည် အခြား Supabase project မှ ဖြစ်ပုံရသည်။ Auth user IDs မရှိပါက restore မအောင်မြင်နိုင်ပါ။ ဆက်လုပ်မလား။'))return;
 // Safety checkpoint: do not start a restore unless the current database and referenced PDFs were backed up successfully.
 await makeBackup(true);
 for(const f of files){let blob;if(f.base64)blob=base64ToBlob(f.base64,f.contentType||'application/pdf');else{const {data,error}=await sb.storage.from('backups-private').download(f.backupPath);throwIf(error);blob=data;}const {error}=await sb.storage.from('papers-private').upload(f.path,blob,{contentType:f.contentType||'application/pdf',upsert:true});throwIf(error);}
 for(const table of order){const arr=bundle.tables[table]||[];for(let i=0;i<arr.length;i+=100){const {error}=await sb.from(table).upsert(arr.slice(i,i+100));throwIf(error);}}
 await afterChange('Restore merge ပြီးပါပြီ။ လက်ရှိအခြေအနေကို restore မတိုင်မီ private backup အဖြစ် သိမ်းထားပြီး Backup ထဲမပါတဲ့ record များကို မဖျက်ခဲ့ပါ။');}
async function importLegacy(bundle){if(!bundle||bundle.format!=='legacy-paper-groups-v1'||!Array.isArray(bundle.groups)||!Array.isArray(bundle.students))throw new Error('Legacy export ဖိုင်ပုံစံ မမှန်ပါ');if(!confirm(`${bundle.groups.length} groups နှင့် ${bundle.students.length} old student names ကို import လုပ်မလား။ လက်ရှိအခြေအနေကို အရင် private backup ယူပါမည်။`))return;await makeBackup(true);const map=new Map(),groupMeta=[];for(const old of bundle.groups){const {data,error}=await sb.from('groups').insert({name:clean(old.name)||'Imported group',created_by:user.id}).select().single();throwIf(error);map.set(old.id||`idx-${groupMeta.length}`,data.id);groupMeta.push({old,id:data.id});}
 for(const x of groupMeta){const g=x.old,groupId=x.id;const hasPaper=!!(g.paper_title||g.paper_link||g.paper_pdf||g.deadline);if(hasPaper){const {error}=await sb.from('papers').insert({group_id:groupId,title:clean(g.paper_title)||'Imported paper (title missing)',source_url:safeUrl(g.paper_link)||null,deadline:g.deadline?new Date(g.deadline).toISOString().slice(0,10):null,created_by:user.id});throwIf(error);}}
 const migrated=(bundle.students||[]).map((s,i)=>({group_id:map.get(s.group_id)||null,legacy_student_id:s.id||String(i+1),display_name:clean(s.name)||'Unnamed legacy student'}));for(let i=0;i<migrated.length;i+=100){const {error}=await sb.from('legacy_members').insert(migrated.slice(i,i+100));throwIf(error);}await afterChange(`Legacy data import ပြီးပါပြီ။ Groups ${groupMeta.length} ခု၊ legacy names ${migrated.length} ခု။ Auth account များကို လိုအပ်ပါက နောက်မှ link လုပ်ပါ။`);}
async function restoreSelectedFile(){const file=$('#restoreFile').files[0];if(!file)throw new Error('JSON ဖိုင်ရွေးပါ');if(file.size>80*1024*1024)throw new Error('ဖိုင်အရွယ်အစား 80 MB limit ကျော်နေသည်');const data=JSON.parse(await file.text());if(data.format==='legacy-paper-groups-v1')return importLegacy(data);if(!confirm('ရွေးထားသော JSON ကို validate လုပ်ပြီး restore/import ဆက်လုပ်မလား။ အရင် backup တစ်ခုယူထားပါ။'))return;return restoreBundle(data);}
async function restoreStored(id){const run=backupRuns.find(x=>x.id===id);if(!run||!confirm('Private backup ကို download လုပ်ပြီး restore merge ပြုလုပ်မလား။ အရင်လက်ရှိအခြေအနေကို backup ယူထားပါ။'))return;const {data,error}=await sb.storage.from('backups-private').download(run.storage_path);throwIf(error);return restoreBundle(JSON.parse(await data.text()));}
async function assignLegacy(id){const record=legacyMembers.find(x=>x.id===id),userId=$(`#legacy-${id}`).value,groupId=$(`#legacy-group-${id}`).value;if(!record||!userId||!groupId)throw new Error('Group နှင့် Account နှစ်ခုလုံး ရွေးပါ');const {error:memberError}=await sb.from('group_members').upsert({group_id:groupId,user_id:userId,member_role:'member',added_by:user.id},{onConflict:'group_id,user_id'});throwIf(memberError);const {error}=await sb.from('legacy_members').update({assigned_user_id:userId,group_id:groupId}).eq('id',id);throwIf(error);await afterChange('Legacy member ကို group/account နှင့် ချိတ်ပြီးပါပြီ');}

 resetRequest:async()=>requestPasswordReset(),
 signout:async()=>{await sb.auth.signOut();user=null;profile=null;notice=null;authView('Logout ပြုလုပ်ပြီးပါပြီ');},
 createGroup,deleteGroup,addMember,removeMember,createPaper,openPdf,deletePaper,removePaperPdf,deleteStudent,resetStudentPassword,deleteStudentAccount,
 saveProgress:async(id,el)=>saveProgress(id,el),createNote,addDiscussion,deleteNote,toggleRole,
 backupDownload:async()=>makeBackup(false),backupStore:async()=>makeBackup(true),restoreFile:async()=>restoreSelectedFile(),restoreStored:async id=>restoreStored(id),downloadPdf,assignLegacy,approveMember,rejectMember
};
async function run(action,id,el){try{const fn=actions[action];if(!fn)throw new Error('ဒီ action ကို မသိပါ');const result=await fn(id,el);return result;}catch(error){console.error(error);if(!user||!profile)authView(error.message||'လုပ်ဆောင်မှု မအောင်မြင်ပါ',true);else announce(error.message||'လုပ်ဆောင်မှု မအောင်မြင်ပါ', 'error');}}

document.addEventListener('submit',async event=>{event.preventDefault();try{if(event.target.id==='signinForm')await signIn(event.target);if(event.target.id==='studentAccountForm')await createStudentAccount(event.target);if(event.target.id==='passwordUpdateForm')await updatePassword();if(event.target.id==='groupForm')await createGroup();if(event.target.id==='paperForm')await createPaper();if(event.target.matches('form[data-group-deadline]'))await saveGroupDeadline(event.target);if(event.target.matches('form[data-add-member]'))await addMember(event.target);if(event.target.matches('form[data-student-form]'))await addStudent(event.target);if(event.target.id==='noteForm')await createNote();if(event.target.matches('form[data-edit-paper]'))await editPaper(event.target);}catch(error){console.error(error);if(event.target.id==='passwordUpdateForm')passwordUpdateView(error.message||'Password ပြောင်းမရပါ',true);else if(!user||!profile)authView(error.message||'လုပ်ဆောင်မှု မအောင်မြင်ပါ',true);else announce(error.message||'လုပ်ဆောင်မှု မအောင်မြင်ပါ','error');}});
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(['saveProgress','filterPapers'].includes(action))return;if(action==='openPaper'){activeTab='papers';notice=null;render();requestAnimationFrame(()=>$('#paper-'+el.dataset.id)?.scrollIntoView({behavior:'smooth',block:'center'}));return;}if(action==='openGroupPapers'){activeTab='papers';notice=null;render();const list=$('#paperList');if(list)list.innerHTML=papers.filter(p=>p.group_id===el.dataset.id).map(paperCard).join('')||'<div class="empty">PDF မရှိသေးပါ။</div>';return;}run(action,el.dataset.id,el);});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.action==='saveProgress')run('saveProgress',el.dataset.id,el);if(el.dataset.action==='filterPapers'){const filter=el.value;const list=$('#paperList');if(list)list.innerHTML=papers.filter(p=>!filter||p.group_id===filter).map(paperCard).join('')||'<div class="empty">Paper မရှိပါ။</div>';}});

async function start(){if(!cfg.supabaseUrl||cfg.supabaseUrl.includes('YOUR-PROJECT-REF')||!cfg.supabasePublishableKey||cfg.supabasePublishableKey.includes('REPLACE_ME')){authView();return;}try{const recoveryLink=location.hash.includes('type=recovery');sb=createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recoveryPending=true;user=session?.user||user;passwordUpdateView();}});const {data,error}=await sb.auth.getSession();throwIf(error);if(!data.session){authView();return;}user=data.session.user;if(recoveryLink||recoveryPending){passwordUpdateView();return;}await loadData();render();}catch(error){console.error(error);authView(`App စတင်ရာတွင် အမှားရှိသည်: ${error.message||error}`,true);}}
start();
</script></body></html>
